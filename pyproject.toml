[project]
name = "psr"
version = "0.1.0"
description = "polish-screen-record: pure-function core for SRT rendering, alignment, and validation"
requires-python = ">=3.11"
dependencies = [
    "groq>=1.6.0",
    "zhconv>=1.4.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psr"]
